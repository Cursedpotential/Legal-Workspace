# Byline: Claude Code · Opus 5 · 2026-08-21 (VPS deploy shape; supersedes the
# 2026-08-18 Grok draft, preserved at _stale/compose.yaml.pre-vps-2026-08-21)
#
# Target host: ovh-app (100.72.169.40). Service names only inside containers.
# Auth boundary revised by Codex · GPT-5 · 2026-09-12: the existing tailnet
# bindings below stay direct for the enrolled owner. A separately configured
# public HTTPS Traefik router protects legal-web with Authentik forward-auth.
# legal-api is never attached to that public router.
# Volumes: bind-mount host dirs, never named volumes (owner backup rule).
#
# PERSISTENCE: the package installs into site-packages, so the repo-relative
# default store dir resolves inside the image and is destroyed on redeploy.
# LEGAL_WORKSPACE_STORE_DIR + the bind mount below are what make state durable.
#
# DATABASE: intentionally left on SQLite-in-the-bind-mount. The ORM declares flat
# tables (legal_core_matter_ref) in the default schema, while sql/0001 creates
# schema-qualified ones (legal_core.matter_ref) with an older column set, and
# db/store.py bootstraps through the SQLite branch of get_engine(). Pointing
# DATABASE_URL at the live PG18 today would deploy a path that has never run.
# Tracked in docs/URGENT-TODO.md as the next increment.

services:
  legal-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: legal-workspace-api:0.1.0
    container_name: legal-api
    restart: unless-stopped
    command: uvicorn legal_workspace.api.main:app --host 0.0.0.0 --port 8010
    # Bound to the tailnet IP only. A bare "8010:8010" publishes on 0.0.0.0 and
    # ovh-app has no DOCKER-USER/ufw rules, so it was reachable from the public
    # internet (verified 2026-08-21: http://40.160.5.19:8010/health returned 200).
    ports:
      - "100.72.169.40:8010:8010"
    env_file:
      - path: .env
        required: false
    environment:
      LEGAL_WORKSPACE_ENV: ${LEGAL_WORKSPACE_ENV:-prod}
      LEGAL_WORKSPACE_STORE_DIR: /data/workspace
      LEGAL_API_SERVICE: legal-api
      EVIDENCE_PLATFORM_SERVICE: contextforge
      MODEL_GATEWAY_SERVICE: model-gateway
      EVIDENCE_PLATFORM_BASE_URL: ${EVIDENCE_PLATFORM_BASE_URL:-http://contextforge:4444}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://model-gateway:4000}
      LEGAL_RENDERER_BASE_URL: http://legal-renderer:3000
      LEGAL_WORKSPACE_BYPASS_AUTH: "false"
      LEGAL_TAILNET_OWNER_ACCESS: "true"
      # Authentik's signing key remains in Authentik. legal-api fetches only the
      # public JWKS and validates issuer, audience, signature and token lifetime.
      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER}
      AUTHENTIK_AUDIENCE: ${AUTHENTIK_AUDIENCE}
      AUTHENTIK_JWKS_URL: ${AUTHENTIK_JWKS_URL}
      AUTHENTIK_ALLOWED_GROUPS: ${AUTHENTIK_ALLOWED_GROUPS:-}
      LEGAL_BFF_SIGNING_SECRET: ${LEGAL_BFF_SIGNING_SECRET}
      CF_GATEWAY_TOKEN: ${CF_GATEWAY_TOKEN:-}
    volumes:
      - /var/lib/legal-workspace/workspace:/data/workspace
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8010/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
    networks:
      - legal
      - probata

  # LibreOffice renderer sidecar (CAT5 `legal-renderer`, added 2026-09-20 by
  # Claude Code · Fable 5.1). Gotenberg wraps headless LibreOffice behind HTTP.
  # No published port: only legal-api reaches it, by service name, on `legal`.
  # Chromium routes are disabled; this sidecar is LibreOffice + PDF engines only.
  legal-renderer:
    image: gotenberg/gotenberg:8.37.0
    container_name: legal-renderer
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --api-timeout=180s
    networks:
      - legal

  legal-web:
    build:
      context: ./web
      dockerfile: ../deploy/Dockerfile.web
    image: legal-workspace-web:0.1.0
    container_name: legal-web
    restart: unless-stopped
    # 3010 is owned by `homepage` on ovh-app — do not reuse it.
    # Tailnet-only for the same reason as legal-api above.
    ports:
      - "100.72.169.40:3011:3000"
    environment:
      LEGAL_API_INTERNAL_URL: http://legal-api:8010
      LEGAL_WEB_INTERNAL_URL: http://legal-web:3000
      LEGAL_PUBLIC_HOST: ${LEGAL_PUBLIC_HOST}
      LEGAL_BFF_SIGNING_SECRET: ${LEGAL_BFF_SIGNING_SECRET}
    depends_on:
      legal-api:
        condition: service_healthy
    networks:
      - legal

networks:
  legal:
    name: legal
  probata:
    external: true
    name: probata
