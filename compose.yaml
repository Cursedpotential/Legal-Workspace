# Byline: Grok · grok-4.6 · 2026-08-18
# Local / Coolify-mirrored compose. Service names only. This desktop has no
# Docker CLI — validate with yaml.safe_load. Boot verification is on the VPS.
# Volumes: bind-mount host dirs, never named volumes (owner backup rule).

services:
  legal-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    image: legal-workspace-api:0.1.0
    container_name: legal-api
    restart: unless-stopped
    command: uvicorn legal_workspace.api.main:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    env_file:
      - path: .env
        required: false
    environment:
      LEGAL_WORKSPACE_ENV: ${LEGAL_WORKSPACE_ENV:-dev}
      LEGAL_API_SERVICE: legal-api
      LEGAL_POSTGRES_SERVICE: legal-postgres
      EVIDENCE_PLATFORM_SERVICE: evidence-platform
      MODEL_GATEWAY_SERVICE: model-gateway
      DATABASE_URL: ${DATABASE_URL:-postgresql://legal_os_app:change-me@legal-postgres:5432/ai}
      EVIDENCE_PLATFORM_BASE_URL: ${EVIDENCE_PLATFORM_BASE_URL:-http://evidence-platform:8000}
      MODEL_GATEWAY_BASE_URL: ${MODEL_GATEWAY_BASE_URL:-http://model-gateway:4000}
    networks:
      - legal
      - agno

  legal-web:
    build:
      context: ./web
      dockerfile: ../deploy/Dockerfile.web
    image: legal-workspace-web:0.1.0
    container_name: legal-web
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      LEGAL_API_INTERNAL_URL: http://legal-api:8010
    depends_on:
      - legal-api
    networks:
      - legal

  legal-postgres:
    image: agno-postgres:18-duckdb
    container_name: legal-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-ai}
      POSTGRES_PASSWORD: ${DB_PASS:-ai}
      POSTGRES_DB: ${DB_DATABASE:-ai}
    volumes:
      - /var/lib/legal-postgres:/var/lib/postgresql
      - ./sql/0001_legal_os_bootstrap.sql:/docker-entrypoint-initdb.d/01_legal_os.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - legal

networks:
  legal:
    name: legal
  agno:
    external: true
    name: agno
